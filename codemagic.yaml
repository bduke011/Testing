workflows:
  flutter-ios-build:
    name: Build Flutter iOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS release
        script: |
          flutter build ios --release
    artifacts:
      - build/ios/iphoneos/**/*.app
    publishing:
      app_store_connect:
        api_key: Encrypted(API_KEY_FROM_CODMAGIC)
